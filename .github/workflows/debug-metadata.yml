#
# Fast metadata diagnosis for iStoreOS 25.12 (no compilation, ~5 min)
#

name: Debug package metadata

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  REPO_URL: https://github.com/istoreos/istoreos
  REPO_BRANCH: istoreos-25.12
  CONFIG_FILE: zero3-istoreos.config
  DIY_P1_SH: diy-part1.sh
  TZ: Asia/Shanghai

jobs:
  debug:
    runs-on: ubuntu-22.04
    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install minimal deps
      run: |
        sudo -E apt-get -qq update
        sudo -E apt-get -qq install --no-install-recommends build-essential clang flex bison gawk gettext git libncurses-dev libssl-dev rsync unzip zlib1g-dev file python3
        sudo timedatectl set-timezone "$TZ"

    - name: Clone istoreos (shallow)
      run: |
        git clone --depth 1 --filter=blob:none "$REPO_URL" -b "$REPO_BRANCH" openwrt

    - name: Run diy-part1
      run: |
        chmod +x "$DIY_P1_SH"
        cd openwrt && "$GITHUB_WORKSPACE/$DIY_P1_SH"

    - name: Update and install feeds
      run: |
        cd openwrt
        ./scripts/feeds update -a 2>&1 | tail -5
        ./scripts/feeds install -a 2>&1 | tail -5

    - name: Load config and defconfig
      run: |
        cd openwrt
        cp "$GITHUB_WORKSPACE/$CONFIG_FILE" .config
        make defconfig 2>&1 | tail -10

    - name: Dump diagnostics
      if: always()
      run: |
        cd openwrt
        echo "===== 1. .config key entries ====="
        for p in luci-app-store luci-app-quickstart dockerd kmod-nf-ipvs kmod-ipt-physdev kmod-veth uwe5622-firmware curl; do
          grep -E "CONFIG_PACKAGE_$p=|# CONFIG_PACKAGE_$p is not set" .config || echo "NOT-IN-CONFIG: $p"
        done
        grep -E "CONFIG_KERNEL_(IP_VS|NETFILTER_XT_MATCH_PHYSDEV)=" .config || echo "kernel toggles missing"
        echo
        echo "===== 2. tmp metadata files ====="
        ls -la tmp/.config*.in tmp/.packageinfo 2>&1
        echo
        echo "===== 3. packageinfo entries (authoritative metadata) ====="
        for p in luci-app-store luci-app-quickstart dockerd; do
          echo "--- $p in tmp/.packageinfo ---"
          grep -A20 "Package: $p\$" tmp/.packageinfo | head -24 || echo "NOT IN packageinfo"
        done
        echo
        echo "===== 4. kconfig symbols in .config-package.in ====="
        for p in luci-app-store luci-app-quickstart dockerd; do
          grep -n "config PACKAGE_$p\b" tmp/.config-package.in | head -3 || echo "NOT IN .config-package.in: $p"
        done
        echo "--- full store definition block (with deps) ---"
        line=$(grep -nE "^[[:space:]]*config PACKAGE_luci-app-store[[:space:]]*$" tmp/.config-package.in | head -1 | cut -d: -f1)
        echo "line=$line"
        sed -n "$((line-3)),$((line+25))p" tmp/.config-package.in
        echo
        echo "--- FEED_* symbols in .config ---"
        grep -E "CONFIG_FEED_|CONFIG_PER_FEED_REPO" .config || echo "NO FEED_ symbols in .config"
        echo
        echo "===== 5. .config-feeds.in (feed wrapper) ====="
        ls -la tmp/.config-feeds.in 2>&1
        head -30 tmp/.config-feeds.in 2>/dev/null || true
        echo
        echo "===== 6. all missing-dependency warnings (final pass) ====="
        make -s prepare-tmpinfo 2>&1 | grep -iE "does not exist|WARNING" | sort -u | head -30 || true

    - name: Upload debug artifacts
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: metadata-debug
        path: |
          openwrt/tmp/.packageinfo
          openwrt/tmp/.config-package.in
          openwrt/tmp/.config-feeds.in
          openwrt/.config
        if-no-files-found: ignore
        include-hidden-files: true
